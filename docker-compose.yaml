version: '3.8'

services:
  db:
    image: postgres:16
    container_name: stores-db
    environment:
      POSTGRES_DB: stores
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - stores_data:/var/lib/postgresql/data

volumes:
  stores_data:
